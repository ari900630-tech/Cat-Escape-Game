<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>בונה פארק</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10233a;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(150deg,#10233af2,#244e69f2);z-index:30}
.card{width:min(430px,100%);background:#fff;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 24px 70px #0008}
.logo{font-size:70px;margin-bottom:5px}.card h1{margin:4px 0 8px;font-size:32px;color:#172437}.card p{color:#647184;line-height:1.5;margin:8px 0 20px}
button{width:100%;border:0;border-radius:16px;padding:14px;margin:6px 0;font-size:17px;font-weight:800;background:#ffb51b;color:#2a1a00;box-shadow:0 8px 20px #0002}
button.secondary{background:#eaf0f5;color:#243449}.hidden{display:none!important}
input{width:100%;border:1px solid #d5dce5;border-radius:14px;padding:14px;margin:6px 0;font-size:16px;text-align:right;outline:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:10;pointer-events:none}
.badge{background:#10233ae8;color:#fff;border:1px solid #ffffff2c;padding:10px 13px;border-radius:15px;font-weight:800}
#buildBar{position:fixed;bottom:10px;left:10px;right:10px;z-index:12;display:flex;gap:7px;overflow-x:auto;padding:4px}
.build{min-width:92px;background:#ffffffef;border-radius:16px;padding:8px;text-align:center;box-shadow:0 8px 24px #0003;pointer-events:auto}
.build b{display:block;font-size:24px}.build span{font-size:12px;font-weight:700;color:#405065}
#settingsBtn{position:fixed;top:12px;right:12px;z-index:14;width:auto;padding:10px 13px;margin:0;background:#ffffffea;color:#25364b;box-shadow:0 6px 18px #0003}
#joystick{position:fixed;left:0;bottom:0;width:210px;height:210px;z-index:15;touch-action:none}
#joyBase{position:absolute;left:35px;bottom:35px;width:125px;height:125px;border-radius:50%;background:#172b40aa;border:2px solid #ffffff55}
#joyKnob{position:absolute;left:72px;bottom:72px;width:51px;height:51px;border-radius:50%;background:#ffb51b;border:3px solid #fff;box-shadow:0 5px 16px #0005}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:20;background:#10233aeF;color:#fff;padding:11px 17px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud" class="hidden"><div class="badge">💰 כסף: <span id="money">500</span></div><div class="badge">🎢 מתקנים: <span id="rides">0</span></div></div>
<button id="settingsBtn" class="hidden">⚙️ הגדרות</button>
<div id="buildBar" class="hidden">
 <button class="build" data-cost="100" data-kind="carousel"><b>🎠</b><span>קרוסלה · $100</span></button>
 <button class="build" data-cost="180" data-kind="swing"><b>🎡</b><span>נדנדה · $180</span></button>
 <button class="build" data-cost="300" data-kind="coaster"><b>🎢</b><span>רכבת · $300</span></button>
 <button class="build" data-cost="80" data-kind="food"><b>🍔</b><span>דוכן · $80</span></button>
</div>
<div id="joystick" class="hidden"><div id="joyBase"></div><div id="joyKnob"></div></div>
<div id="toast"></div>

<div id="welcome" class="screen"><div class="card">
 <div class="logo">🎡</div><h1>בונה פארק</h1><p>בנה פארק שעשועים משלך, הרוויח כסף מהמבקרים והרחב אותו עם מתקנים חדשים.</p>
 <button id="goLogin">כניסה למשחק</button>
 <button id="guest" class="secondary">כניסה מהירה</button>
</div></div>

<div id="login" class="screen hidden"><div class="card">
 <div class="logo">🎟️</div><h1>כניסה</h1><p>היכנס כדי להתחיל לנהל את הפארק.</p>
 <input id="name" placeholder="שם השחקן">
 <input id="pass" type="password" placeholder="סיסמה">
 <button id="loginBtn">כניסה</button><button id="backWelcome" class="secondary">חזרה</button>
</div></div>

<div id="settings" class="screen hidden"><div class="card">
 <div class="logo">⚙️</div><h1>הגדרות</h1>
 <button id="reset" class="secondary">איפוס המשחק</button>
 <button id="closeSettings">חזרה למשחק</button>
</div></div>

<script>
const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
document.getElementById('game').appendChild(canvas);
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let money=Number(localStorage.parkMoney||500), rides=JSON.parse(localStorage.parkRides||'[]');
let player={x:0,y:0,dir:0};let playing=false;let last=performance.now();let incomeTimer=0;
const joy={active:false,sx:0,sy:0,x:0,y:0};
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1400)};
function ui(){money=Math.floor(money);document.getElementById('money').textContent=money;document.getElementById('rides').textContent=rides.length}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.add('hidden'));if(id)document.getElementById(id).classList.remove('hidden')}
function start(){playing=true;show(null);document.getElementById('hud').classList.remove('hidden');document.getElementById('settingsBtn').classList.remove('hidden');document.getElementById('buildBar').classList.remove('hidden');document.getElementById('joystick').classList.remove('hidden');ui();toast('הפארק שלך מוכן!')}
document.getElementById('goLogin').onclick=()=>show('login');
document.getElementById('backWelcome').onclick=()=>show('welcome');
document.getElementById('guest').onclick=start;
document.getElementById('loginBtn').onclick=()=>{if(!document.getElementById('name').value.trim()){toast('כתוב שם שחקן');return}start()};
document.getElementById('settingsBtn').onclick=()=>show('settings');
document.getElementById('closeSettings').onclick=start;
document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל הפארק והכסף?')){money=500;rides=[];localStorage.removeItem('parkMoney');localStorage.removeItem('parkRides');ui();start()}};

function worldToScreen(x,y){const scale=Math.min(W,H)/29;return [W/2+(x-player.x)*scale,H/2+(y-player.y)*scale]}
function drawGround(){
 ctx.fillStyle='#77c86b';ctx.fillRect(0,0,W,H);
 const scale=Math.min(W,H)/29;
 for(let x=-18;x<=18;x+=2){let a=worldToScreen(x,-18),b=worldToScreen(x,18);ctx.strokeStyle='#ffffff22';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
 for(let y=-18;y<=18;y+=2){let a=worldToScreen(-18,y),b=worldToScreen(18,y);ctx.strokeStyle='#ffffff22';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
}
function drawRide(r){
 const [x,y]=worldToScreen(r.x,r.y),s=Math.min(W,H)/29;
 ctx.save();ctx.translate(x,y);ctx.font=(2*s)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.beginPath();ctx.arc(0,0,1.05*s,0,Math.PI*2);ctx.fillStyle='#ffffffcc';ctx.fill();
 ctx.fillText(r.icon,0,0);ctx.font='bold '+(.55*s)+'px Arial';ctx.fillStyle='#26384d';ctx.fillText(r.name,0,1.55*s);ctx.restore();
}
function drawPlayer(){
 const [x,y]=worldToScreen(player.x,player.y),s=Math.min(W,H)/29;
 ctx.save();ctx.translate(x,y);ctx.rotate(player.dir);
 ctx.beginPath();ctx.ellipse(0,.35*s,.48*s,.7*s,0,0,Math.PI*2);ctx.fillStyle='#2469b0';ctx.fill();
 ctx.beginPath();ctx.arc(0,-.38*s,.48*s,0,Math.PI*2);ctx.fillStyle='#f0b68d';ctx.fill();
 ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-.16*s,-.42*s,.06*s,0,7);ctx.arc(.16*s,-.42*s,.06*s,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(-.28*s,.05*s,.56*s,.16*s);ctx.restore();
}
function draw(){
 if(!playing){requestAnimationFrame(draw);return}
 drawGround();rides.forEach(drawRide);drawPlayer();
 const scale=Math.min(W,H)/29;
 const [px,py]=worldToScreen(player.x,player.y);
 ctx.fillStyle='#fff';ctx.font='bold '+(.42*scale)+'px Arial';ctx.textAlign='center';ctx.fillText('אתה',px,py+1.25*scale);
}
function tick(now){
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(playing){
  const dx=joy.x,dy=joy.y;
  if(Math.hypot(dx,dy)>.08){const sp=4.2;player.x+=dx*sp*dt;player.y+=dy*sp*dt;player.dir=Math.atan2(dy,dx)+Math.PI/2}
  player.x=Math.max(-13,Math.min(13,player.x));player.y=Math.max(-13,Math.min(13,player.y));
  incomeTimer+=dt;if(incomeTimer>=5){incomeTimer=0;const gain=rides.length*12;money+=gain;localStorage.parkMoney=money;if(gain)toast('הפארק הרוויח $'+gain);ui()}
 }
 requestAnimationFrame(tick)
}
requestAnimationFrame(tick);requestAnimationFrame(draw);

const joyEl=document.getElementById('joystick'),knob=document.getElementById('joyKnob');
function joyMove(e){const max=55,dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,l=Math.hypot(dx,dy),k=l>max?max/l:1;joy.x=dx*k/max;joy.y=dy*k/max;knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}
function joyReset(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerdown',e=>{if(!playing)return;joy.active=true;joy.sx=e.clientX;joy.sy=e.clientY;joy.x=joy.y=0;joyEl.setPointerCapture(e.pointerId)});
joyEl.addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});joyEl.addEventListener('pointerup',joyReset);joyEl.addEventListener('pointercancel',joyReset);

document.querySelectorAll('.build').forEach(btn=>btn.onclick=()=>{
 if(!playing)return;const cost=Number(btn.dataset.cost);
 if(money<cost){toast('אין מספיק כסף');return}
 const x=player.x+Math.cos(player.dir-Math.PI/2)*2.2,y=player.y+Math.sin(player.dir-Math.PI/2)*2.2;
 const data={carousel:['🎠','קרוסלה'],swing:['🎡','נדנדה'],coaster:['🎢','רכבת הרים'],food:['🍔','דוכן אוכל']}[btn.dataset.kind];
 money-=cost;rides.push({x,y,icon:data[0],name:data[1]});localStorage.parkMoney=money;localStorage.parkRides=JSON.stringify(rides);ui();toast('נבנה: '+data[1]);
});
</script>
</body>
</html>
