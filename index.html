<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>מרדף החתול והעכבר</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
.badge{background:rgba(15,22,38,.82);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:10px 14px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px #0004}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:rgba(15,22,38,.78);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.3s}
#joystick{position:fixed;bottom:18px;left:18px;width:140px;height:140px;border-radius:50%;background:transparent;border:0;display:block;z-index:20;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:1px;height:1px;margin:-.5px;border-radius:50%;background:transparent;box-shadow:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827eF,#172554eF);z-index:10;padding:24px}
.panel{width:min(430px,100%);text-align:center;background:#fffffffa;border-radius:28px;padding:30px 24px;box-shadow:0 24px 80px #0008}
.panel h1{margin:0 0 10px;font-size:31px;color:#172033}.panel p{color:#5d6678;line-height:1.55;margin:8px 0 22px}
button{border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:800;background:#f4b400;color:#241900;cursor:pointer;box-shadow:0 8px 20px #f4b40055}
button:active{transform:scale(.97)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="badge">גבינות: <span id="score">0</span></div>
  <div class="badge">שיא: <span id="best">0</span></div>
</div>
<div id="hint">הזז את האצבע בפינה כדי להזיז את העכבר</div>
<div id="joystick"><div id="stick"></div></div>
<div id="start" class="overlay">
 <div class="panel">
  <div style="font-size:64px">🐭 🧀 🐱</div>
  <h1>מרדף החתול והעכבר</h1>
  <p>אתה העכבר. אסוף את הגבינות הצהובות בזירה התלת־ממדית — והתחמק מהחתול שרודף אחריך.</p>
  <button id="startBtn">התחל משחק</button>
 </div>
</div>
<div id="gameover" class="overlay hidden">
 <div class="panel">
  <div style="font-size:58px">🐱💨🐭</div>
  <h1>החתול תפס אותך!</h1>
  <p>אספת <b id="finalScore">0</b> גבינות.</p>
  <button id="restartBtn">שחק שוב</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ed8ff);
scene.fog=new THREE.Fog(0x9ed8ff,18,48);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
camera.position.set(0,17,16); camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x5d7650,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-8,18,10); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const arena=28;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(arena,arena),new THREE.MeshStandardMaterial({color:0x77bd68,roughness:.9}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const grid=new THREE.GridHelper(arena,28,0xffffff,0x9bd38d); grid.position.y=.015; grid.material.transparent=true; grid.material.opacity=.35; scene.add(grid);

function makeCharacter(type){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:type==='mouse'?0xb9bec8:0x8d4fbd,roughness:.75});
 const bellyMat=new THREE.MeshStandardMaterial({color:type==='mouse'?0xf0d6c2:0xdca9ed});
 const body=new THREE.Mesh(new THREE.SphereGeometry(type==='mouse'?0.72:1.05,20,14),bodyMat);
 body.scale.set(1.15,.8,1.45); body.position.y=.82; body.castShadow=true; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(type==='mouse'?.57:.82,20,14),bodyMat);
 head.position.set(0,1.15,-.72); head.castShadow=true; g.add(head);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(type==='mouse'?.48:.62,16,12),bellyMat);
 belly.scale.set(1,.8,.35); belly.position.set(0,.76,-.66); g.add(belly);
 const earMat=bodyMat;
 for(const x of [-1,1]){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(type==='mouse'?.23:.34,.55,12),earMat);
  ear.position.set(x*(type==='mouse'?.38:.55),1.68,-.72); ear.rotation.z=x*-.25; ear.castShadow=true; g.add(ear);
 }
 const eyeMat=new THREE.MeshStandardMaterial({color:0x151515});
 for(const x of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(type==='mouse'?.07:.1,10,8),eyeMat);
  eye.position.set(x*(type==='mouse'?.22:.3),1.27,-1.25); g.add(eye);
 }
 if(type==='mouse'){
  const tail=new THREE.Mesh(new THREE.TorusGeometry(.6,.08,8,24,Math.PI*1.4),new THREE.MeshStandardMaterial({color:0xd7a895}));
  tail.rotation.y=Math.PI/2; tail.position.set(0,.55,1.25); g.add(tail);
 }else{
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,1.8,12),bodyMat);
  tail.position.set(0,.85,1.45); tail.rotation.x=-.55; tail.castShadow=true; g.add(tail);
 }
 return g;
}
const mouse=makeCharacter('mouse'), cat=makeCharacter('cat');
mouse.position.set(0,0,5); cat.position.set(-7,0,-5); scene.add(mouse,cat);

const cheeseGroup=new THREE.Group(); scene.add(cheeseGroup);
const cheeseMat=new THREE.MeshStandardMaterial({color:0xffd21f,roughness:.5});
function createCheese(x,z){
 const g=new THREE.Group();
 const c=new THREE.Mesh(new THREE.ConeGeometry(.62,.42,3),cheeseMat);
 c.rotation.x=Math.PI/2; c.rotation.z=Math.PI/6; c.position.y=.45; c.castShadow=true; g.add(c);
 const holes=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),new THREE.MeshStandardMaterial({color:0xd39b0b}));
 holes.scale.set(1,.35,.6); holes.position.set(.12,.5,-.25); g.add(holes);
 g.position.set(x,0,z); g.userData.spin=Math.random()*Math.PI*2; cheeseGroup.add(g);
 return g;
}
let cheeses=[];
function respawnCheeses(){
 cheeses.forEach(c=>cheeseGroup.remove(c)); cheeses=[];
 const pts=[[-8,-7],[7,-7],[-9,1],[8,2],[-4,8],[4,7],[0,-8],[10,8]];
 pts.forEach(p=>cheeses.push(createCheese(p[0],p[1])));
}
respawnCheeses();

const target=new THREE.Vector3(mouse.position.x,0,mouse.position.z);
let playing=false,score=0, best=Number(localStorage.catEscapeBest||0);
document.getElementById('best').textContent=best;

const keys={};
const joystick=document.getElementById('joystick'), stick=document.getElementById('stick');
let joystickActive=false;
function updateJoystick(e){
 const r=joystick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
 let dx=e.clientX-cx, dy=e.clientY-cy, max=35, len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 stick.style.transform='translate('+dx+'px,'+dy+'px)';
 const power=Math.min(Math.hypot(dx,dy)/max,1);
 if(power>.05){
  const move=new THREE.Vector3(dx/max,0,dy/max);
  target.copy(mouse.position).add(move.normalize().multiplyScalar(3+power*2.5));
 }
}
function resetJoystick(){joystickActive=false;stick.style.transform='translate(0,0)';}
joystick.addEventListener('pointerdown',e=>{if(!playing)return;joystickActive=true;joystick.setPointerCapture(e.pointerId);updateJoystick(e);});
joystick.addEventListener('pointermove',e=>{if(joystickActive&&playing)updateJoystick(e);});
joystick.addEventListener('pointerup',resetJoystick);
joystick.addEventListener('pointercancel',resetJoystick);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);



const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 if(playing){
  const move=new THREE.Vector3();
  if(keys.w||keys.arrowup)move.z-=1;if(keys.s||keys.arrowdown)move.z+=1;if(keys.a||keys.arrowleft)move.x-=1;if(keys.d||keys.arrowright)move.x+=1;
  if(move.lengthSq())target.copy(mouse.position).add(move.normalize().multiplyScalar(3));
  const dir=target.clone().sub(mouse.position); dir.y=0;
  const dist=dir.length();
  if(dist>.12){dir.normalize(); mouse.position.addScaledVector(dir,5.2*dt); mouse.rotation.y=Math.atan2(dir.x,-dir.z);}
  mouse.position.x=THREE.MathUtils.clamp(mouse.position.x,-12.5,12.5);mouse.position.z=THREE.MathUtils.clamp(mouse.position.z,-12.5,12.5);
  const chase=mouse.position.clone().sub(cat.position);chase.y=0;
  if(chase.length()>.02){chase.normalize();cat.position.addScaledVector(chase,2.55*dt);cat.rotation.y=Math.atan2(chase.x,-chase.z);}
  for(const c of cheeses){
   c.rotation.y+=dt*1.5;
   if(c.visible && c.position.distanceTo(mouse.position)<1.05){
    c.visible=false;score++;document.getElementById('score').textContent=score;
    setTimeout(()=>{c.position.set((Math.random()-.5)*23,0,(Math.random()-.5)*23);c.visible=true;},850);
   }
  }
  if(cat.position.distanceTo(mouse.position)<1.15)endGame();
 }
 renderer.render(scene,camera);
}
function startGame(){
 score=0;document.getElementById('score').textContent=0;cat.position.set(-7,0,-5);mouse.position.set(0,0,5);target.copy(mouse.position);
 cheeses.forEach(c=>c.visible=true);playing=true;
 document.getElementById('start').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');
 document.getElementById('hint').textContent='השתמש בג׳ויסטיק בפינה כדי שהאצבע לא תסתיר את העכבר';
}
function endGame(){
 if(!playing)return;playing=false;
 best=Math.max(best,score);localStorage.catEscapeBest=best;document.getElementById('best').textContent=best;
 document.getElementById('finalScore').textContent=score;document.getElementById('gameover').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script>
</body>
</html>
