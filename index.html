<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>מרדף החתול והעכבר</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
.badge{background:rgba(15,22,38,.82);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:10px 14px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px #0004}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:rgba(15,22,38,.78);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.3s}
#joystick{position:fixed;bottom:0;left:0;width:210px;height:210px;background:transparent;border:0;display:block;z-index:20;pointer-events:auto;touch-action:none}
#stick{display:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827eF,#172554eF);z-index:10;padding:24px}
.panel{width:min(430px,100%);text-align:center;background:#fffffffa;border-radius:28px;padding:30px 24px;box-shadow:0 24px 80px #0008}
.panel h1{margin:0 0 10px;font-size:31px;color:#172033}.panel p{color:#5d6678;line-height:1.55;margin:8px 0 22px}
button{border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:800;background:#f4b400;color:#241900;cursor:pointer;box-shadow:0 8px 20px #f4b40055}
button:active{transform:scale(.97)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="badge">גבינות: <span id="score">0</span></div>
  <div class="badge">שיא: <span id="best">0</span></div>
</div>
<div id="hint">החלק את האצבע בפינה — העכבר ינוע לפי כיוון ההחלקה</div>
<div id="joystick"><div id="stick"></div></div>
<div id="start" class="overlay">
 <div class="panel">
  <div style="font-size:64px">🐭 🧀 🐱</div>
  <h1>מרדף החתול והעכבר</h1>
  <p>אתה העכבר. אסוף את הגבינות הצהובות בזירה התלת־ממדית — והתחמק מהחתול שרודף אחריך.</p>
  <button id="startBtn">התחל משחק</button>
 </div>
</div>
<div id="gameover" class="overlay hidden">
 <div class="panel">
  <div style="font-size:58px">🐱💨🐭</div>
  <h1>החתול תפס אותך!</h1>
  <p>אספת <b id="finalScore">0</b> גבינות.</p>
  <button id="restartBtn">שחק שוב</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ed8ff);
scene.fog=new THREE.Fog(0x9ed8ff,18,48);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
camera.position.set(0,17,16); camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x5d7650,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-8,18,10); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const arena=28;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(arena,arena),new THREE.MeshStandardMaterial({color:0x77bd68,roughness:.9}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const grid=new THREE.GridHelper(arena,28,0xffffff,0x9bd38d); grid.position.y=.015; grid.material.transparent=true; grid.material.opacity=.35; scene.add(grid);

function makeCharacter(type){
 const g=new THREE.Group();
 const isMouse=type==='mouse';
 const bodyMat=new THREE.MeshStandardMaterial({color:isMouse?0x9da3ad:0x8d4fbd,roughness:.82,metalness:0});
 const bellyMat=new THREE.MeshStandardMaterial({color:isMouse?0xe9c8b6:0xdca9ed,roughness:.9});
 const pinkMat=new THREE.MeshStandardMaterial({color:isMouse?0xf09aa7:0xc87fcf,roughness:.75});
 const darkMat=new THREE.MeshStandardMaterial({color:0x17151a,roughness:.35});
 const whiteMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4});
 const body=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.72:1.05,28,20),bodyMat);
 body.scale.set(isMouse?1.18:1.15,isMouse?.78:.82,isMouse?1.52:1.42); body.position.y=.82; body.castShadow=true; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.58:.82,28,20),bodyMat);
 head.position.set(0,isMouse?1.16:1.18,-.78); head.scale.set(1.03,1,1.05); head.castShadow=true; g.add(head);
 const muzzle=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.34:.42,20,14),bellyMat);
 muzzle.scale.set(1,.72,.72); muzzle.position.set(0,isMouse?1.03:1.12,-1.22); muzzle.castShadow=true; g.add(muzzle);
 const nose=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.10:.12,14,10),pinkMat);
 nose.scale.set(1,.75,1); nose.position.set(0,isMouse?1.08:1.15,-1.50); g.add(nose);
 const earMat=isMouse?pinkMat:bodyMat;
 const ears=[];
 for(const x of [-1,1]){
  const outer=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.28:.34,20,14),bodyMat);
  outer.scale.set(.72,1,.45); outer.position.set(x*(isMouse?.40:.55),isMouse?1.63:1.75,-.78); outer.castShadow=true; g.add(outer);
  const inner=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.18:.22,18,12),earMat);
  inner.scale.set(.72,1,.4); inner.position.set(x*(isMouse?.40:.55),isMouse?1.63:1.75,-1.02); g.add(inner);
  ears.push(outer);
 }
 const eyes=[];
 for(const x of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.105:.13,16,12),darkMat);
  eye.position.set(x*(isMouse?.23:.30),isMouse?1.30:1.38,-1.25); eye.castShadow=true; g.add(eye);
  if(isMouse){
   const glint=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),whiteMat);
   glint.position.set(x*.23-.025,1.335,-1.335); g.add(glint);
  }
  eyes.push(eye);
 }
 if(isMouse){
  const whiskerMat=new THREE.LineBasicMaterial({color:0xf6eee8,transparent:true,opacity:.9});
  for(const side of [-1,1]) for(let i=0;i<3;i++){
   const y=1.00+i*.07, pts=[new THREE.Vector3(side*.15,y,-1.40),new THREE.Vector3(side*(.72+i*.08),y+(i-1)*.025,-1.43)];
   const geo=new THREE.BufferGeometry().setFromPoints(pts);
   g.add(new THREE.Line(geo,whiskerMat));
  }
 }
 const legs=[];
 const legPositions=isMouse?[[-.42,.55,-.48],[.42,.55,-.48],[-.42,.55,.48],[.42,.55,.48]]:[[-.55,.55,-.55],[.55,.55,-.55],[-.55,.55,.55],[.55,.55,.55]];
 for(const [x,y,z] of legPositions){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(isMouse?.13:.19,.38,6,10),bodyMat);
  leg.position.set(x,y,z); leg.castShadow=true; g.add(leg);
  const paw=new THREE.Mesh(new THREE.SphereGeometry(isMouse?.16:.22,14,10),bellyMat);
  paw.scale.set(1,.55,1.25); paw.position.set(x,y-.22,z-(z<0?.10:-.10)); paw.castShadow=true; g.add(paw);
  legs.push(leg,paw);
 }
 if(isMouse){
  const tail=new THREE.Mesh(new THREE.TorusGeometry(.68,.075,10,30,Math.PI*1.55),new THREE.MeshStandardMaterial({color:0xd69c8e,roughness:.8}));
  tail.rotation.y=Math.PI/2; tail.position.set(0,.62,1.48); tail.castShadow=true; g.add(tail);
  g.userData.tail=tail;
 }else{
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(.13,.21,1.8,14),bodyMat);
  tail.position.set(0,.88,1.48); tail.rotation.x=-.55; tail.castShadow=true; g.add(tail);
  g.userData.tail=tail;
 }
 g.userData.legs=legs; g.userData.phase=Math.random()*Math.PI*2; g.userData.body=body;
 return g;
}
const mouse=makeCharacter('mouse'), cat=makeCharacter('cat');
mouse.position.set(0,0,5); cat.position.set(-7,0,-5); scene.add(mouse,cat);

const cheeseGroup=new THREE.Group(); scene.add(cheeseGroup);
const cheeseMat=new THREE.MeshStandardMaterial({color:0xffd21f,roughness:.5});
function createCheese(x,z){
 const g=new THREE.Group();
 const c=new THREE.Mesh(new THREE.ConeGeometry(.62,.42,3),cheeseMat);
 c.rotation.x=Math.PI/2; c.rotation.z=Math.PI/6; c.position.y=.45; c.castShadow=true; g.add(c);
 const holes=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),new THREE.MeshStandardMaterial({color:0xd39b0b}));
 holes.scale.set(1,.35,.6); holes.position.set(.12,.5,-.25); g.add(holes);
 g.position.set(x,0,z); g.userData.spin=Math.random()*Math.PI*2; cheeseGroup.add(g);
 return g;
}
let cheeses=[];
function respawnCheeses(){
 cheeses.forEach(c=>cheeseGroup.remove(c)); cheeses=[];
 const pts=[[-8,-7],[7,-7],[-9,1],[8,2],[-4,8],[4,7],[0,-8],[10,8]];
 pts.forEach(p=>cheeses.push(createCheese(p[0],p[1])));
}
respawnCheeses();

let playing=false,score=0, best=Number(localStorage.catEscapeBest||0);
document.getElementById('best').textContent=best;

const keys={};
const joystick=document.getElementById('joystick');
let joystickActive=false;
let touchStartX=0,touchStartY=0;
const joystickVector=new THREE.Vector2();

function updateJoystick(e){
 const dx=e.clientX-touchStartX, dy=e.clientY-touchStartY;
 const max=70, len=Math.hypot(dx,dy);
 const scale=len>max?max/len:1;
 joystickVector.set((dx*scale)/max,(dy*scale)/max);
}
function resetJoystick(){joystickActive=false;joystickVector.set(0,0);}
joystick.addEventListener('pointerdown',e=>{
 if(!playing)return;
 joystickActive=true;
 touchStartX=e.clientX; touchStartY=e.clientY;
 joystickVector.set(0,0);
 joystick.setPointerCapture(e.pointerId);
});
joystick.addEventListener('pointermove',e=>{if(joystickActive&&playing)updateJoystick(e);});
joystick.addEventListener('pointerup',resetJoystick);
joystick.addEventListener('pointercancel',resetJoystick);

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);



const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 if(playing){
  const move=new THREE.Vector3();
  if(keys.w||keys.arrowup)move.z-=1;
  if(keys.s||keys.arrowdown)move.z+=1;
  if(keys.a||keys.arrowleft)move.x-=1;
  if(keys.d||keys.arrowright)move.x+=1;
  if(joystickActive && joystickVector.lengthSq()>0.0025){
   move.x=joystickVector.x;
   move.z=joystickVector.y;
  }
  const moving=move.lengthSq()>0.0025;
  if(moving){
   move.normalize();
   const speed=5.2;
   mouse.position.addScaledVector(move,speed*dt);
   mouse.rotation.y=Math.atan2(-move.x,-move.z);
   const runTime=performance.now()*.018;
   const swing=Math.sin(runTime)*.55;
   const legs=mouse.userData.legs||[];
   for(let i=0;i<legs.length;i+=2){
    const dir=(i===0||i===4)?1:-1;
    legs[i].rotation.x=swing*dir;
    legs[i+1].rotation.x=swing*dir;
   }
   mouse.userData.body.position.y=.82+Math.abs(Math.sin(runTime*2))*.035;
   mouse.userData.tail.rotation.z=Math.sin(runTime*.8)*.12;
  }else{
   const legs=mouse.userData.legs||[];
   for(let i=0;i<legs.length;i+=2){legs[i].rotation.x=0;legs[i+1].rotation.x=0;}
   mouse.userData.body.position.y=.82+Math.sin(performance.now()*.003)*.008;
  }
  mouse.position.x=THREE.MathUtils.clamp(mouse.position.x,-12.5,12.5);
  mouse.position.z=THREE.MathUtils.clamp(mouse.position.z,-12.5,12.5);
  const chase=mouse.position.clone().sub(cat.position);chase.y=0;
  if(chase.length()>.02){
   chase.normalize();cat.position.addScaledVector(chase,2.55*dt);cat.rotation.y=Math.atan2(chase.x,-chase.z);
  }
  for(const c of cheeses){
   c.rotation.y+=dt*1.5;
   if(c.visible && c.position.distanceTo(mouse.position)<1.05){
    c.visible=false;score++;document.getElementById('score').textContent=score;
    setTimeout(()=>{c.position.set((Math.random()-.5)*23,0,(Math.random()-.5)*23);c.visible=true;},850);
   }
  }
  if(cat.position.distanceTo(mouse.position)<1.15)endGame();
 }
 renderer.render(scene,camera);
}
function startGame(){
 score=0;document.getElementById('score').textContent=0;cat.position.set(-7,0,-5);mouse.position.set(0,0,5);joystickVector.set(0,0);joystickActive=false;
 cheeses.forEach(c=>c.visible=true);playing=true;
 document.getElementById('start').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');
 document.getElementById('hint').textContent='הזז את האצבע בפינה כדי להזיז את העכבר';
}
function endGame(){
 if(!playing)return;playing=false;
 best=Math.max(best,score);localStorage.catEscapeBest=best;document.getElementById('best').textContent=best;
 document.getElementById('finalScore').textContent=score;document.getElementById('gameover').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script>
</body>
</html>
