<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>בונה פארק 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#07111ceF,#173a4feF);z-index:30}.card{width:min(430px,100%);background:#fff;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 24px 70px #0009}.logo{font-size:68px}.card h1{margin:4px 0 8px;font-size:32px;color:#172437}.card p{color:#647184;line-height:1.5;margin:8px 0 20px}button{width:100%;border:0;border-radius:16px;padding:14px;margin:6px 0;font-size:17px;font-weight:800;background:#f2ad24;color:#241600;box-shadow:0 8px 20px #0002}button.secondary{background:#eaf0f5;color:#243449}.hidden{display:none!important}input{width:100%;border:1px solid #d5dce5;border-radius:14px;padding:14px;margin:6px 0;font-size:16px;text-align:right;outline:0}#hud{position:fixed;top:12px;left:12px;right:74px;display:flex;gap:8px;z-index:10;pointer-events:none;direction:ltr}.badge{background:#091a2be8;min-width:82px;text-align:center;color:#fff;border:1px solid #ffffff28;padding:10px 13px;border-radius:15px;font-weight:800;backdrop-filter:blur(8px)}#settingsBtn{position:fixed;top:12px;right:12px;z-index:14;width:auto;padding:10px 13px;margin:0;background:#ffffffeF;color:#25364b}#buildBar{position:fixed;bottom:12px;left:10px;right:10px;z-index:12;display:flex;gap:7px;overflow-x:auto;padding:4px}.build{min-width:104px;background:#fffffff0;border-radius:16px;padding:8px;text-align:center;box-shadow:0 8px 24px #0004;pointer-events:auto}.build b{display:block;font-size:24px}.build span{font-size:12px;font-weight:700;color:#405065}#joystick{position:fixed;left:0;bottom:64px;width:180px;height:180px;z-index:15;touch-action:none}#joyBase{position:absolute;left:28px;bottom:28px;width:115px;height:115px;border-radius:50%;background:#071827aa;border:2px solid #ffffff45}#joyKnob{position:absolute;left:60px;bottom:60px;width:51px;height:51px;border-radius:50%;background:#f2ad24;border:3px solid #fff;box-shadow:0 5px 16px #0005}#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:20;background:#091a2bef;color:#fff;padding:11px 17px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}</style></head><body><div id="game"></div><div id="hud" class="hidden"><div class="badge">💰 <span id="money">500</span></div><div class="badge">🎢 <span id="rides">0</span></div></div><button id="settingsBtn" class="hidden">⚙️</button><div id="buildBar" class="hidden"><button class="build" data-cost="100" data-kind="carousel"><b>🎠</b><span>קרוסלה · $100</span></button><button class="build" data-cost="180" data-kind="wheel"><b>🎡</b><span>גלגל ענק · $180</span></button><button class="build" data-cost="300" data-kind="coaster"><b>🎢</b><span>רכבת הרים · $300</span></button><button class="build" data-cost="80" data-kind="food"><b>🍔</b><span>דוכן אוכל · $80</span></button><button class="build" data-cost="160" data-kind="boats"><b>🚤</b><span>סירות מים · $160</span></button><button class="build" data-cost="140" data-kind="bumper"><b>🚗</b><span>מכוניות מתנגשות · $140</span></button><button class="build" data-cost="220" data-kind="drop"><b>🗼</b><span>מגדל נפילה · $220</span></button></div><div id="joystick" class="hidden"><div id="joyBase"></div><div id="joyKnob"></div></div><div id="toast"></div><div id="welcome" class="screen"><div class="card"><div class="logo">🎡</div><h1>בונה פארק 3D</h1><p>בנה פארק שעשועים בתלת־ממד, הסתובב בו ובנה מתקנים אמיתיים.</p><button id="goLogin">כניסה למשחק</button><button id="guest" class="secondary">כניסה מהירה</button></div></div><div id="login" class="screen hidden"><div class="card"><div class="logo">🎟️</div><h1>כניסה</h1><input id="name" placeholder="שם השחקן"><input id="pass" type="password" placeholder="סיסמה"><button id="loginBtn">כניסה</button><button id="backWelcome" class="secondary">חזרה</button></div></div><div id="settings" class="screen hidden"><div class="card"><div class="logo">⚙️</div><h1>הגדרות</h1><button id="reset" class="secondary">איפוס המשחק</button><button id="closeSettings">חזרה למשחק</button></div></div><script type="module">import*as THREE from"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";const root=document.getElementById("game"),scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed8f0);scene.fog=new THREE.Fog(0x9ed8f0,38,105);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,180),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xcfefff,0x5b6b45,2.1));const sun=new THREE.DirectionalLight(0xfff4d6,3.2);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x5b9b55,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function box(w,h,d,c,x,y,z,r=.75){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:r}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function cyl(r,h,c,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),new THREE.MeshStandardMaterial({color:c,roughness:.65}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function tree(x,z){cyl(.18,2.2,0x66513a,x,1.1,z);const a=new THREE.Mesh(new THREE.SphereGeometry(1.15,18,14),new THREE.MeshStandardMaterial({color:0x2e783b,roughness:1}));a.position.set(x,2.6,z);a.castShadow=true;scene.add(a)}function path(w,d,x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),new THREE.MeshStandardMaterial({color:0xb8a98f,roughness:.9}));m.position.set(x,.02,z);m.receiveShadow=true;scene.add(m)}path(8,100,0,0);path(100,7,0,0);path(5,45,-14,0);path(5,45,14,0);
function bench(x,z,rot=0){const g=new THREE.Group();g.position.set(x,.35,z);g.rotation.y=rot;const seat=new THREE.Mesh(new THREE.BoxGeometry(1.7,.16,.48),new THREE.MeshStandardMaterial({color:0x8b542f,roughness:.8}));seat.position.y=.55;seat.castShadow=true;g.add(seat);for(const sx of[-.62,.62]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.38),new THREE.MeshStandardMaterial({color:0x333941,roughness:.7}));leg.position.set(sx,.27,0);leg.castShadow=true;g.add(leg)}const back=new THREE.Mesh(new THREE.BoxGeometry(1.7,.65,.12),new THREE.MeshStandardMaterial({color:0x744324,roughness:.8}));back.position.set(0,.88,-.18);back.castShadow=true;g.add(back);scene.add(g)}
function sign(text,x,z){const g=new THREE.Group();g.position.set(x,0,z);const post=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2,10),new THREE.MeshStandardMaterial({color:0x55585d}));post.position.y=1;post.castShadow=true;g.add(post);const cv=document.createElement("canvas");cv.width=512;cv.height=128;const ctx=cv.getContext("2d");ctx.fillStyle="#17324b";ctx.fillRect(0,0,512,128);ctx.fillStyle="#fff";ctx.font="bold 42px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,256,64);const tx=new THREE.CanvasTexture(cv);const board=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.95),new THREE.MeshBasicMaterial({map:tx,transparent:true}));board.position.y=2.05;g.add(board);scene.add(g)}
bench(-5,-4,.1);bench(5,-4,-.1);bench(-5,14,Math.PI/2);bench(5,14,Math.PI/2);bench(-5,30,.1);bench(5,30,-.1);
sign("קרוסלה 🎠",0,6);sign("גלגל ענק 🎡",18,-4);sign("רכבת הרים 🎢",-18,-4);sign("דוכן אוכל 🍔",18,16);
sign("סירות מים 🚤",-18,16);sign("מכוניות מתנגשות 🚗",18,28);sign("מגדל נפילה 🗼",-18,28);for(let i=-42;i<=42;i+=10){tree(-9,i);tree(9,i)}for(let i=-40;i<=40;i+=10){tree(i,-9);tree(i,9)}box(14,2,1,0xe8e0d0,0,2,-45);box(1.1,7,1.4,0xd64c3f,-6.5,3.5,-45);box(1.1,7,1.4,0xd64c3f,6.5,3.5,-45);box(15,1.1,1.5,0x2e5e9e,0,7,-45);box(10,.4,1.8,0xf5d36a,0,5.8,-45);const park=[];let money=Number(localStorage.parkMoney||500),playing=false,incomeTimer=0;const player={x:0,z:20,rot:0,walk:0};const keys={},joy={active:false,x:0,y:0,sx:0,sy:0};const playerGroup=new THREE.Group();scene.add(playerGroup);const visitors=[];
function makeVisitor(i){
 const g=new THREE.Group(), colors=[0x3b6db3,0xc94f4f,0x4c8b55,0x8b5aa8,0xd08a3c];
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.65,5,8),new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:.85}));
 body.position.y=.7;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),new THREE.MeshStandardMaterial({color:0xe3a47e,roughness:.9}));
 head.position.y=1.35;head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8,0,Math.PI*2,0,Math.PI*.5),new THREE.MeshStandardMaterial({color:i%2?0x2b211b:0x5a3824,roughness:1}));
 hair.position.y=1.42;hair.castShadow=true;g.add(hair);
 g.position.set((i%5-2)*3,0,10+Math.floor(i/5)*6);
 scene.add(g);
 return {obj:g,x:g.position.x,z:g.position.z,targetX:g.position.x,targetZ:g.position.z,speed:.8+Math.random()*.5,phase:Math.random()*10,ride:null};
}
for(let i=0;i<12;i++)visitors.push(makeVisitor(i));
function updateVisitors(dt,t){
 visitors.forEach((v,i)=>{
  if(!v.ride && park.length){
   const r=park[i%park.length];
   if(Math.hypot(v.x-r.x,v.z-r.z)<1.2){v.ride=r;v.targetX=r.x;v.targetZ=r.z;}
   else if(Math.hypot(v.x-v.targetX,v.z-v.targetZ)<1.5){
    v.targetX=r.x+(i%3-1)*1.4;v.targetZ=r.z+((i+1)%3-1)*1.4;
   }
  }
  if(v.ride){
   const r=v.ride;
   v.obj.position.set(r.x+(i%3-1)*.55, .25, r.z+((i+1)%3-1)*.55);
   v.obj.rotation.y=t*.35+i;
   if(Math.random()<dt*.015)v.ride=null;
  }else{
   const dx=v.targetX-v.x,dz=v.targetZ-v.z,d=Math.hypot(dx,dz);
   if(d<1.2){
    const a=Math.random()*Math.PI*2,rad=10;
    v.targetX=Math.max(-38,Math.min(38,v.x+Math.cos(a)*rad));
    v.targetZ=Math.max(-38,Math.min(38,v.z+Math.sin(a)*rad));
   }else{
    v.x+=dx/d*v.speed*dt;v.z+=dz/d*v.speed*dt;
    v.obj.position.set(v.x,Math.abs(Math.sin(t*6+v.phase))*.035,v.z);
    v.obj.rotation.y=Math.atan2(dx,dz);
   }
  }
 });
}const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.05,6,12),new THREE.MeshStandardMaterial({color:0x2d69a9,roughness:.8}));body.position.y=1.05;body.castShadow=true;playerGroup.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,20,16),new THREE.MeshStandardMaterial({color:0xe7ad83,roughness:.9}));head.position.y=2.05;head.castShadow=true;playerGroup.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.4,20,12,0,Math.PI*2,0,Math.PI*.48),new THREE.MeshStandardMaterial({color:0x35271f,roughness:1}));hair.position.y=2.13;hair.castShadow=true;playerGroup.add(hair);function makeRide(k,x,z){const g=new THREE.Group();g.position.set(x,0,z);if(k==="carousel"){cyl(2.2,.35,0xc94e42,0,.18,0);cyl(.28,3.1,0xf0c64c,0,1.7,0);const roof=new THREE.Mesh(new THREE.ConeGeometry(2.45,.9,32),new THREE.MeshStandardMaterial({color:0xe8b83e,roughness:.5}));roof.position.y=3.25;roof.castShadow=true;g.add(roof)}else if(k==="wheel"){const p1=box(.3,5,.3,0x5c6370,-2,2.5,0),p2=box(.3,5,.3,0x5c6370,2,2.5,0);g.add(p1,p2);const w=new THREE.Mesh(new THREE.TorusGeometry(3.1,.13,10,48),new THREE.MeshStandardMaterial({color:0xd53f42,metalness:.3,roughness:.5}));w.rotation.y=Math.PI/2;w.position.y=5.2;w.castShadow=true;g.add(w);for(let i=0;i<10;i++){const a=i*Math.PI/5,s=box(.08,6.1,.08,0xd53f42,0,5.2,0,.45);s.rotation.z=a;s.rotation.y=Math.PI/2;g.add(s)}}else if(k==="coaster"){for(let i=0;i<7;i++){const a=i/6*Math.PI*1.2;g.add(box(.18,2,.18,0x555e66,Math.cos(a)*4,1,Math.sin(a)*4))}const r=new THREE.Mesh(new THREE.TorusGeometry(4,.09,8,40,Math.PI*1.2),new THREE.MeshStandardMaterial({color:0xd34b3d,metalness:.4,roughness:.4}));r.rotation.x=Math.PI/2;r.position.y=2.1;g.add(r)}else if(k==="boats"){g.add(box(4,.3,2.5,0x4d7fa3,0,.2,0,.8));for(let i=-1;i<=1;i++){const b=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.7,5,8),new THREE.MeshStandardMaterial({color:i?0xe4b63e:0xd94c45,roughness:.7}));b.rotation.z=Math.PI/2;b.position.set(i*1.25,.55,0);b.castShadow=true;g.add(b)}}
else if(k==="bumper"){for(let i=0;i<6;i++){const a=i*Math.PI/3;g.add(box(3,.25,.25,0x444b55,Math.cos(a)*2,2.2,Math.sin(a)*2,.6));const car=box(.65,.35,1, [0xd94c45,0x2e6aa6,0xe5b83b][i%3],Math.cos(a)*1.1,.45,Math.sin(a)*1.1,.55);g.add(car)}}
else if(k==="drop"){g.add(box(.45,7,.45,0x5d6470,0,3.5,0,.6));const top=box(2,.35,2,0xe0a83c,0,7,0,.5);g.add(top);const cabin=box(1,.8,1,0xd64b42,0,4.4,0,.5);g.add(cabin)}
else{g.add(box(3.5,2.4,2.5,0xc96d3e,0,1.2,0,.7),box(3.7,.2,2.7,0x6a3928,0,2.5,0,.7),box(1.2,.9,.12,0x25394b,0,1.4,1.28,.4))}scene.add(g);return g}function rebuild(){park.forEach(r=>scene.remove(r.obj));park.length=0;JSON.parse(localStorage.parkRides||"[]").forEach(r=>park.push({...r,obj:makeRide(r.kind,r.x,r.z)}))}rebuild();function ui(){money=Math.max(0,money);document.getElementById("money").textContent=Math.floor(money);document.getElementById("rides").textContent=park.length}function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1500)}function show(id){document.querySelectorAll(".screen").forEach(e=>e.classList.add("hidden"));if(id)document.getElementById(id).classList.remove("hidden")}function start(){playing=true;show(null);["hud","settingsBtn","buildBar","joystick"].forEach(id=>document.getElementById(id).classList.remove("hidden"));ui();toast("הפארק שלך מוכן")}goLogin.onclick=()=>show("login");backWelcome.onclick=()=>show("welcome");guest.onclick=start;loginBtn.onclick=()=>{if(!name.value.trim()){toast("כתוב שם שחקן");return}start()};settingsBtn.onclick=()=>show("settings");closeSettings.onclick=start;reset.onclick=()=>{if(confirm("לאפס את כל הפארק והכסף?")){money=500;localStorage.removeItem("parkMoney");localStorage.removeItem("parkRides");rebuild();ui();start()}};document.querySelectorAll(".build").forEach(b=>b.onclick=()=>{if(!playing)return;const cost=+b.dataset.cost;if(money<cost)return toast("אין מספיק כסף");const a=player.rot,x=Math.round((player.x+Math.sin(a)*5)*2)/2,z=Math.round((player.z+Math.cos(a)*5)*2)/2,r={kind:b.dataset.kind,x,z};money-=cost;park.push({...r,obj:makeRide(r.kind,x,z)});localStorage.parkMoney=money;localStorage.parkRides=JSON.stringify(park.map(({obj,...q})=>q));ui();toast("המתקן נבנה")});function setJoy(e){const dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,max=55,l=Math.hypot(dx,dy),q=l>max?max/l:1;joy.x=dx*q/max;joy.y=dy*q/max;joyKnob.style.transform="translate("+dx*q+"px,"+dy*q+"px)"}joystick.onpointerdown=e=>{if(!playing)return;joy.active=true;joy.sx=e.clientX;joy.sy=e.clientY;joystick.setPointerCapture(e.pointerId);setJoy(e)};joystick.onpointermove=e=>{if(joy.active)setJoy(e)};joystick.onpointerup=()=>{joy.active=false;joy.x=joy.y=0;joyKnob.style.transform="translate(0,0)"};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);let last=performance.now();function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;if(playing){updateVisitors(dt,t/1000);let x=joy.x,y=joy.y;if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;const l=Math.hypot(x,y);if(l>.05){x/=l;y/=l;const speed=5.8*dt;player.x+=x*speed;player.z+=y*speed;player.x=Math.max(-42,Math.min(42,player.x));player.z=Math.max(-40,Math.min(40,player.z));player.rot=Math.atan2(x,y);player.walk+=dt*13}playerGroup.position.set(player.x,0,player.z);playerGroup.rotation.y=player.rot;body.position.y=1.05+Math.abs(Math.sin(player.walk))*.045;const distance=12,height=7;const desired=new THREE.Vector3(player.x-Math.sin(player.rot)*distance,height,player.z-Math.cos(player.rot)*distance);camera.position.lerp(desired,.10);camera.lookAt(player.x,1.15,player.z);incomeTimer+=dt;if(incomeTimer>=5){incomeTimer-=5;const gain=park.length*12;if(gain){money+=gain;localStorage.parkMoney=money;ui();toast("הפארק הרוויח $"+gain)}}}renderer.render(scene,camera)}animate(performance.now());addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))});ui();</script></body></html>
