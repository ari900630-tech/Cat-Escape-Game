else if(k==="bumper"){for(let i=0;i<6;i++){const a=i*Math.PI/3;g.add(box(3,.25,.25,0x444b55,Math.cos(a)*2,2.2,Math.sin(a)*2,.6));const car=box(.65,.35,1, [0xd94c45,0x2e6aa6,0xe5b83b][i%3],Math.cos(a)*1.1,.45,Math.sin(a)*1.1,.55);g.add(car)}}

});function setJoy(e){const dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,max=55,l=Math.hypot(dx,dy),q=l>max?max/l:1;joy.x=dx*q/max;joy.y=dy*q/max;joyKnob.style.transform="translate("+dx*q+"px,"+dy*q+"px)"}joystick.onpointerdown=e=>{if(!playing)return;joy.active=true;joy.sx=e.clientX;joy.sy=e.clientY;joystick.setPointerCapture(e.pointerId);setJoy(e)};joystick.onpointermove=e=>{if(joy.active)setJoy(e)};joystick.onpointerup=()=>{joy.active=false;joy.x=joy.y=0;joyKnob.style.transform="translate(0,0)"};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);let last=performance.now();function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;if(playing){dayTime=(dayTime+dt*.12)%24;const daylight=Math.max(.18,Math.sin((dayTime-6)/12*Math.PI));sun.intensity=1.1+2.1*daylight;scene.background.setHSL(.55,.45,.18+.45*daylight);scene.fog.color.copy(scene.background);updateBirds(t/1000);updateRoosters(dt,t/1000);updateVisitors(dt,t/1000);park.forEach((r,i)=>{if(!r.obj)return;const q=r.obj;if(r.kind==="wheel"){const w=q.children.find(c=>c.geometry&&c.geometry.type==="TorusGeometry");if(w)w.rotation.x+=dt*.9}if(r.kind==="carousel")q.rotation.y+=dt*1.2;if(r.kind==="boats")q.rotation.y+=dt*.35;if(r.kind==="bumper")q.rotation.y+=dt*.18;if(r.kind==="drop"){const cab=q.children[q.children.length-1];if(cab)cab.position.y=4.4+Math.sin(t/1000*1.7+i)*2.2}});let x=joy.x,y=joy.y;if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;const l=Math.hypot(x,y);if(l>.05){x/=l;y/=l;const speed=(fly?9:5.8)*dt;player.x+=x*speed;player.z+=y*speed;player.x=Math.max(-42,Math.min(42,player.x));player.z=Math.max(-40,Math.min(40,player.z));player.rot=Math.atan2(x,y);player.walk+=dt*13}if(fly){if(keys[" " ]||keys.q)flyHeight+=8*dt;if(keys.shift)flyHeight-=8*dt;flyHeight=Math.max(3,Math.min(35,flyHeight))}else flyHeight=2;playerGroup.position.set
